[package]
name = "jabro-draw"
version = "0.1.0"
edition = "2021"
description = "Jabro Draw - a hybrid vector + paint editor with bevels, textures, perspective and NPR looks"
license = "MIT"
repository = "https://github.com/jensbroecher/JabroDraw"
publish = false  # an application, not a crate for crates.io

[dependencies]
eframe = "0.31"
tiny-skia = "0.11"
ab_glyph = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
i_overlay = "9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "tga", "ico", "qoi", "avif"] }
tract-onnx = "0.23"
jabro-models = { version = "0.1.0", path = "crates/jabro-models" }
arboard = "3"
# JPEG XL pictures (pure Rust)
jxl-oxide = { version = "0.12", features = ["image"] }

[target.'cfg(windows)'.dependencies]
# Windows' own image codecs (HEIC, AVIF, camera RAW…) through WIC
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }

# Pixel loops are painfully slow unoptimised, so even dev builds get optimised.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
psd = "0.3"

[workspace]
members = ["crates/jabro-models", "crates/jabro-setup"]
