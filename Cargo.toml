[package]
name = "jabro-draw"
version = "0.1.0"
edition = "2021"
description = "Jabro Draw - a hybrid vector + paint editor with bevels, textures, perspective and NPR looks"
publish = false  # no license chosen yet — all rights reserved until you pick one

[dependencies]
eframe = "0.31"
tiny-skia = "0.11"
ab_glyph = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
i_overlay = "9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "tga", "ico"] }
tract-onnx = "0.23"
jabro-models = { version = "0.1.0", path = "crates/jabro-models" }
arboard = "3"

# Pixel loops are painfully slow unoptimised, so even dev builds get optimised.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
